name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        os: ['ubuntu-latest', 'windows-latest']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: PHP syntax
        shell: bash
        run: find modules -name '*.php' -exec php -l {} \;
      - run: php tests/run.php
      - run: npm ci
      - run: npm test
